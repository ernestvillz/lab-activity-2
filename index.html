<!DOCTYPE html>
<html>
<head>
    <title>My Tutorial Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 40px;
            max-width: 700px;
            margin: auto;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ccc;
        }

        h1 {
            color: #333;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>My Simple Tutorial Website</h1>

    <p>
        Welcome to my website. This page was created for Lab Activity 2.
    </p>

    <h2>How to Create a Simple Website</h2>

    <p>
        1. Create an HTML file.<br>
        2. Add your content.<br>
        3. Style the page using CSS.<br>
        4. Upload the project to GitHub.<br>
        5. Deploy it using Netlify.
    </p>

    <button onclick="alert('Website is working!')">
        Test Website
    </button>
</div>

</body>
</html>
